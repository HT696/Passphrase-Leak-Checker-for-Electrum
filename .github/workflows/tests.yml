name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.extra }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
            extra: test-qt5
            interpreter: .venv/bin/python
          - os: ubuntu-22.04
            python: '3.10'
            extra: test-qt6
            interpreter: .venv/bin/python
          - os: ubuntu-22.04
            python: '3.12'
            extra: test-qt5
            interpreter: .venv/bin/python
          - os: ubuntu-22.04
            python: '3.12'
            extra: test-qt6
            interpreter: .venv/bin/python
          - os: windows-latest
            python: '3.12'
            extra: test-qt6
            interpreter: .venv/Scripts/python.exe
          - os: macos-latest
            python: '3.12'
            extra: test-qt6
            interpreter: .venv/bin/python
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Bootstrap uv with pip; use uv for project environments and dependencies.
      - name: Install pinned uv bootstrap
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.9.18
      - name: Create environment
        run: uv venv --python python .venv
      - name: Install package and one Qt binding
        run: uv pip install --python ${{ matrix.interpreter }} ".[${{ matrix.extra }}]"
      - name: Offline checks with network guard
        run: ${{ matrix.interpreter }} scripts/test.py --suite offline --strict
      - name: Full checks using only local HTTP fixtures
        run: ${{ matrix.interpreter }} scripts/test.py --strict
      - name: Build Electrum plugin
        run: ${{ matrix.interpreter }} scripts/build_electrum.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electrum-passphrase-leak-checker-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.extra }}
          path: dist/*
          if-no-files-found: error

  release-evidence:
    name: Attested build after all test targets pass
    needs: tests
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build ZIP, checksum and input manifest without dependencies
        run: python scripts/build_electrum.py
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electrum-passphrase-leak-checker-attested-build
          path: dist/*
          if-no-files-found: error
